services:
  app:
    build:
      context: .
      dockerfile: Docker/Dockerfile
    container_name: service-finance-api
    networks:
      - financialsystems
    restart: always
    volumes:
      - .:/app
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      - mysql
      # - mongo
    command: npm run start

  mysql:
    image: mysql
    container_name: db-service-finance
    networks:
      - financialsystems
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    ports:
      - 3307:3306

  # mongo:
  #   image: mongo
  #   container_name: mongo-service-finance
  #   networks:
  #     - financialsystems
  #   restart: always
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: root
  #     MONGO_INITDB_ROOT_PASSWORD: root
  #   ports:
  #     - 27017:27017
  #   volumes:
  #     - mongo_data:/data/db

  redis:
    image: redis:latest
    container_name: redis-service-finance
    networks:
      - financialsystems
    restart: always
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    command: ['redis-server', '--appendonly', 'yes']

networks:
  financialsystems:
      driver: bridge

volumes:
  mysql_data:
  mongo_data:
  redis_data:

